name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy src

      - name: Tests
        run: pytest

      - name: The generated files are up to date
        run: python -m labtrack_bi check

  schemas:
    name: project files against the schemas of Microsoft
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: microsoft/json-schemas
          path: json-schemas

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: The tests of the report, with the schema tests switched on (they are skipped everywhere else)
        run: pytest tests/test_pbir.py
        env:
          LABTRACK_BI_SCHEMAS: ${{ github.workspace }}/json-schemas

  power-query:
    name: Power Query with the parser of Microsoft
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install
        run: npm ci
        working-directory: tools

      - name: Check the nine queries
        run: npm run check-m
        working-directory: tools

  wheel:
    name: build and smoke-test the wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Install it in a clean environment and use it
        run: |
          python -m venv smoke
          smoke/bin/python -m pip install dist/*.whl
          smoke/bin/python -m labtrack_bi --version
          smoke/bin/python -c "from labtrack_bi import mlint, pbir, spec; assert len(mlint.library()) >= 20 and pbir.base_theme_bytes() and len(spec.PAGES) == 4"
